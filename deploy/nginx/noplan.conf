# /etc/nginx/sites-available/noplan
# 复制到服务器后：ln -s /etc/nginx/sites-available/noplan /etc/nginx/sites-enabled/noplan
# 然后：sudo nginx -t && sudo systemctl reload nginx
#
# 前提：
#   1) 应用只监听 127.0.0.1:8080（docker-compose.yml 已改）
#   2) /etc/nginx/sites-enabled/default 已删除或 disable（否则它才是默认站点）

server {
    listen 80;
    listen [::]:80;

    # 没有域名，匹配任何 Host。以后绑域名就改这里
    server_name _;

    # 本项目单独日志，方便 tail / grep
    access_log /var/log/nginx/noplan.access.log;
    error_log  /var/log/nginx/noplan.error.log warn;

    # 大一点的请求体上限（当前表单不大，留个余量）
    client_max_body_size 2m;

    location / {
        # 末尾不加斜杠 = 原样透传 URI，FastAPI 路由不用改
        proxy_pass http://127.0.0.1:8080;

        # 与后端复用连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 把真实信息传给应用（uvicorn 侧需要 --proxy-headers）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时：连接 5s，读 60s
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}